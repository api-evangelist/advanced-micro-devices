name: AMD Ryzen AI MCP Server
description: >-
  AMD publishes a first-party Model Context Protocol server, amd/ryzenai-mcp-server, in its own
  GitHub organization. It gives an MCP client semantic search over the AMD Ryzen AI documentation
  (https://ryzenai.docs.amd.com) and the amd/RyzenAI-SW code samples repository, backed by a local
  embedding index. It is a documentation/knowledge server, not a control plane for AMD hardware or
  cloud resources.
status: published
deployment:
  mode: local-stdio
  endpoint: null
  install: "git clone https://github.com/amd/ryzenai-mcp-server && cd ryzenai-mcp-server && pip install -r requirements.txt && python server.py"
  package: https://github.com/amd/ryzenai-mcp-server
  auth: none
  verified: searched
  note: >-
    AMD ships NO hosted/remote MCP endpoint. The repository's own server.json declares
    `"transport": ["stdio"]` and `"config": {"command": "python", "args": ["server.py"]}`, and
    .mcp.json registers it as a stdio server with `cwd: ${PLUGIN_ROOT}`. There is no npm or PyPI
    distribution — installation is a git clone plus `pip install -r requirements.txt`. A human must
    install and run it on a machine before any agent can reach it. GITHUB_TOKEN is an OPTIONAL
    environment variable used only to raise GitHub API rate limits while indexing; the server itself
    requires no credential.
repository: https://github.com/amd/ryzenai-mcp-server
license: MIT
